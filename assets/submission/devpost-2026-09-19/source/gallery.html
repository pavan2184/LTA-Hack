<main class="sheet" id="sheet">

<script>
const pages={
 '02':{label:'01 / Work schedule',title:'See the<br><em>whole plan.</em>',desc:'From contracts to activities, every week stays in view.',facts:['54 activities. 14 contracts.','A 30-week planning horizon.','Expand. Inspect. Navigate.'],file:'02-work-schedule.png',alt:'RailPlan public-instance weekly schedule with contracts, access blocks and a horizon navigator.'},
 '03':{label:'02 / Explanations',title:'Understand<br><em>why it lands<br>here.</em>',desc:'The reasoning stays beside the work you are reviewing.',facts:['Trace predecessor dependencies.','Inspect planned and scheduled starts.','Ask about this schedule.'],file:'03-explanations.png',alt:'A004 selected with an explanation that it starts in week 16 because A003 finishes in week 15.',dark:true},
 '04':{label:'03 / Change review',title:'Review<br><em>before<br>you apply.</em>',desc:'Test a maintenance change. Inspect its impact. Keep the final decision.',facts:['Preview a capacity reduction.','See what moves and what stays.','Apply or keep the current plan.'],file:'04-change-review.png',alt:'Maintenance proposal review with impact metrics and Apply reviewed change and Keep current schedule buttons.'},
 '05':{label:'04 / Policy comparison',title:'Compare<br><em>the trade-offs.</em>',desc:'Three policies. One complete workload. Make the constraints visible.',facts:['A — Fixed supply.','B — Fixed completion targets.','C — Bounded flexibility.'],file:'05-policy-comparison.png',alt:'Expanded A, B and C policy metrics showing different delay, excess and ECLO trade-offs.',dark:true}
};
const key=new URLSearchParams(location.search).get('slide')||'02';
const p=pages[key]||pages['02'];
document.title='RailPlan — '+p.label;
document.getElementById('sheet').classList.toggle('dark',!!p.dark);
document.getElementById('eyebrow').textContent=p.label;
document.getElementById('title').innerHTML=p.title;
document.getElementById('desc').textContent=p.desc;
document.getElementById('facts').innerHTML=p.facts.map((text,i)=>'<p class="fact"><span>0'+(i+1)+'</span>'+text+'</p>').join('');
document.getElementById('product').src='../screenshots/'+p.file;
document.getElementById('product').alt=p.alt;
document.getElementById('index').textContent=String(Number(key)-1).padStart(2,'0')+' / 04';
</script>
