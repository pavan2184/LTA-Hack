# Include inside nginx's http context. Terminate HTTPS at a Google Cloud HTTPS
# load balancer that preserves Host and sets X-Forwarded-Proto to https.
limit_req_zone $binary_remote_addr zone=ps1_solve:10m rate=12r/m;
server {
    listen 8080;
    client_max_body_size 4m;
    client_body_timeout 15s;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 100s;
    }
    location = /api/ps1/solve {
        limit_req zone=ps1_solve burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # 60s native search + 15s child startup/model allowance; browser waits 90s.
        proxy_read_timeout 100s;
        proxy_request_buffering on;
    }
}
