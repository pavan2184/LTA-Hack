name: CI

on:
  push:
  pull_request:

jobs:
  algorithm-lab-checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lab dependencies and formatter
        run: python -m pip install -r demos/algorithm-lab/requirements.txt ruff==0.15.14

      - name: Check Python source
        run: |
          ruff check demos/algorithm-lab scripts/algorithm-lab
          ruff format --check demos/algorithm-lab scripts/algorithm-lab

      - name: Test model and API
        run: python -m unittest discover -s demos/algorithm-lab -p 'test_*.py' -v

      - name: Check deployment script
        run: bash -n demos/algorithm-lab/deploy.sh

  frontend-checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
